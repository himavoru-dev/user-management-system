<!DOCTYPE html>
<html>
<head>
  <title>User Management</title>
</head>

<body>

  <h1>User Management System</h1>

  <h2>Login</h2>

  <input id="email" type="email" placeholder="Email">
  <br><br>

  <input id="password" type="password" placeholder="Password">
  <br><br>

  <button onclick="login()">Login</button>
  <button onclick="getUsers()">Get Users</button>

  <br><br>

  <h2>Create User</h2>

  <input id="name" type="text" placeholder="Name">
  <br><br>

  <input id="newEmail" type="email" placeholder="Email">
  <br><br>

  <input id="newPassword" type="password" placeholder="Password">
  <br><br>

  <select id="role">
    <option value="USER">USER</option>
    <option value="ADMIN">ADMIN</option>
  </select>

  <br><br>

  <button onclick="createUser()">Create User</button>

  <br><br>

  <h2>Get User By ID</h2>

  <input id="userId" type="number" placeholder="Enter User ID">
  <button onclick="getUserById()">Get User</button>

  <br><br>

  <h2>Update User</h2>

  <input id="updateUserId" type="number" placeholder="User ID">
  <br><br>

  <input id="updateName" type="text" placeholder="New Name">
  <br><br>

  <input id="updateEmail" type="email" placeholder="New Email">
  <br><br>

  <input id="updatePassword" type="password" placeholder="New Password">
  <br><br>

  <select id="updateRole">
    <option value="USER">USER</option>
    <option value="ADMIN">ADMIN</option>
  </select>

  <br><br>

  <button onclick="updateUser()">Update User</button>

  <br><br>

  <h2>Delete User</h2>

  <input id="deleteUserId" type="number" placeholder="User ID">
  <br><br>

  <button onclick="deleteUser()">Delete User</button>

  <br><br>

  <p id="message"></p>

  <script>

    // LOGIN
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          email: email,
          password: password
        })
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem('access_token', data.access_token);

        document.getElementById('message').innerText =
          'Login successful!';
      } else {
        document.getElementById('message').innerText =
          data.message || 'Login failed';
      }
    }


    // GET ALL USERS
    async function getUsers() {
      const token = localStorage.getItem('access_token');

      const response = await fetch('/users', {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await response.json();

      document.getElementById('message').innerText =
        JSON.stringify(data, null, 2);
    }


    // CREATE USER
    async function createUser() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('newEmail').value;
      const password = document.getElementById('newPassword').value;
      const role = document.getElementById('role').value;

      const token = localStorage.getItem('access_token');

      const response = await fetch('/users', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
          name: name,
          email: email,
          password: password,
          role: role
        })
      });

      const data = await response.json();

      document.getElementById('message').innerText =
        JSON.stringify(data, null, 2);
    }


    // GET USER BY ID
    async function getUserById() {
      const id = document.getElementById('userId').value;
      const token = localStorage.getItem('access_token');

      const response = await fetch(`/users/${id}`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await response.json();

      document.getElementById('message').innerText =
        JSON.stringify(data, null, 2);
    }


    // UPDATE USER
    async function updateUser() {
      const id = document.getElementById('updateUserId').value;
      const name = document.getElementById('updateName').value;
      const email = document.getElementById('updateEmail').value;
      const password = document.getElementById('updatePassword').value;
      const role = document.getElementById('updateRole').value;

      const token = localStorage.getItem('access_token');

      const response = await fetch(`/users/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
          name: name,
          email: email,
          password: password,
          role: role
        })
      });

      const data = await response.json();

      document.getElementById('message').innerText =
        JSON.stringify(data, null, 2);
    }


    // DELETE USER
    async function deleteUser() {
      const id = document.getElementById('deleteUserId').value;
      const token = localStorage.getItem('access_token');

      const response = await fetch(`/users/${id}`, {
        method: 'DELETE',
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await response.json();

      document.getElementById('message').innerText =
        data.message || JSON.stringify(data, null, 2);
    }

</script>
</body>
</html>
